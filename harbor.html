<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU HARBOR</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c100a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>HARBOR</span></h1><p class="sub">Reads the public ships. Quotes them. Needs the radio.</p></header>
<div class="warn">This page calls out. It is not a lane. Radio off, it cannot read the fleet. A miss stays not packed.</div>
<div class="bar"><input id="q" placeholder="storm, salt, rule…" enterkeyhint="search"><button id="send">Read</button></div>
<main id="out"></main>
<script>
var SHIPS=["tru-speaks","tru-door","tru-rules","tru-water","tru-fire","tru-shelter","tru-cold","tru-salt","tru-sun","tru-quiet","tru-place","tru-join","tru-signal","tru-fish"];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function textOf(html){
  var d=document.createElement("div");
  d.innerHTML=html.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ");
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
function snippets(name, text, q){
  var words=q.toLowerCase().split(/\s+/).filter(Boolean);
  var low=text.toLowerCase();
  var hits=[];
  words.forEach(function(w){
    var i=low.indexOf(w);
    if(i<0) return;
    hits.push(text.slice(Math.max(0,i-80), i+140));
  });
  return hits.slice(0,2).map(function(s){return {ship:name, s:s};});
}
function show(html){document.getElementById("out").innerHTML=html;}
async function read(){
  var q=(document.getElementById("q").value||"").trim();
  if(!q){show('<article class="card"><div class="k">HARBOR</div><div class="big">Type an ask</div><div>It will quote a public ship, or say not packed.</div></article>');return;}
  show('<article class="card"><div class="k">HARBOR</div><div class="big">Reading</div><div>Fetching the public files.</div></article>');
  var found=[];
  await Promise.all(SHIPS.map(async function(name){
    try{
      var res=await fetch("https://raw.githubusercontent.com/splashdown1/"+name+"/main/index.html");
      if(!res.ok) return;
      var t=textOf(await res.text());
      found=found.concat(snippets(name,t,q));
    }catch(e){}
  }));
  if(!found.length){show('<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No public ship held that line, or the radio is off.</div></article>');return;}
  show(found.map(function(x){
    return '<article class="card"><div class="k">QUOTE</div><div class="big">'+esc(x.ship)+'</div><div>'+esc(x.s)+'</div><div class="src">Pulled from the file. Not a new fact.</div></article>';
  }).join(""));
}
document.getElementById("send").onclick=read;
document.getElementById("q").onkeydown=function(e){if(e.key==="Enter") read();};
show('<article class="card"><div class="k">HARBOR</div><div class="big">Online reader</div><div>Quotes the public ships. Does not invent. Does not govern.</div></article>');
</script>
</body>
</html>
